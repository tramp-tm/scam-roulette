<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Game</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Lots List -->
        <div class="left-panel">
            <div class="panel">
                <!-- Header row with title and sort switch -->
                <div class="lots-header-row">
                    <h3>📋 Lots</h3>
                    <div id="sort-controls" class="switch">
                        <button id="sort-by-name" class="switch-btn active" data-sort-field="name" title="Sort by name (A-Z)">
                            🅰️ Name
                        </button>
                        <button id="sort-by-amount" class="switch-btn" data-sort-field="amount" title="Sort by amount ($ low-high)">
                            💵 Amount
                        </button>
                    </div>
                </div>
            
                <!-- Scrollable lots list wrapper -->
                <div id="lots-list-wrapper">
                    <ul id="lots-list"></ul>
                </div>
            
                <!-- Add New Lot Row (outside scrollable area, always visible) -->
                <li class="lot-item add-row">
                    <div id="new-lot-color-indicator" class="lot-color-indicator"></div>
                    <input type="text" id="new-lot-name" placeholder="Lot Name" class="add-lot-input">
                    <input type="number" id="new-lot-amount" placeholder="$" min="0.01" step="0.01" value="1" class="add-lot-amount">
                    <button id="add-lot-btn" class="btn-add">➕</button>
                </li>
            </div>
        </div>

        <!-- Center Panel: Canvas, Result Display, Stats, and Controls -->
        <div class="main-panel">
            <h1>🎰 Roulette Game 🎰</h1>
            
            <!-- Combined container for result-display and stats (equal height) -->
            <div id="info-container">
                <div id="result-display">
                    <div id="result-text"></div>
                </div>
                <div id="stats-display">
                    <div class="stat-item">
                        <div id="total-lots" class="stat-value">0</div>
                        <div class="stat-label">Total Lots</div>
                    </div>
                    <div class="stat-item">
                        <div id="active-lots" class="stat-value">0</div>
                        <div class="stat-label">Active Lots</div>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="roulette-canvas" width="600" height="500"></canvas>
            </div>

            <div class="panel">
                <h3>Controls</h3>
                <div style="display: flex; gap: 15px;">
                    <button id="spin-btn" class="btn-primary">🎲 SPIN!</button>
                    <button id="reset-btn" class="btn-secondary">🔄 Reset</button>
                    <button id="import-btn-controls" class="btn-secondary">📥 Import</button>
                </div>
            </div>
        </div>

        <!-- Import dialog will be created dynamically by ImportDialog component -->

        <!-- Right Panel: Settings -->
        <div class="sidebar">
            <!-- Settings Panel -->
            <div class="panel settings-panel">
                <div class="settings-header-row">
                    <h3>⚙️ Settings</h3>
                    <button id="toggle-settings-subblock" class="settings-toggle-btn" title="Toggle additional settings">⁝</button>
                </div>
                
                <!-- Main settings (always visible) -->
                <div class="settings-main-block">
                    <div class="settings-group">
                        <label for="mode-select">Game Mode</label>
                    <select id="mode-select">
                        <option value="normal" selected>Normal (Higher amount = Higher chance)</option>
                        <option value="survival">Survival (Lower amount = Eliminated first)</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="visualization-select">Visualization</label>
                    <select id="visualization-select">
                        <option value="wheel" selected>Wheel</option>
                        <option value="strip">Strip</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="duration-slider">Animation Duration</label>
                    <div class="slider-container">
                        <input type="range" id="duration-slider" min="1" max="68" step="1" value="3">
                        <input type="number" id="duration-input" min="1" max="300" step="1" value="3" class="duration-number-input">
                        <span id="duration-value" class="slider-value">3.0s</span>
                    </div>
                </div>
                
                <!-- Collapsible sub-block (hidden by default) -->
                <div id="settings-subblock" class="settings-sub-block hidden">
                    <h4>Additional Options</h4>
                    
                    <div class="settings-group">
                        <label for="sound-toggle">Sound Effects</label>
                        <select id="sound-toggle">
                            <option value="on" selected>On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    
                    <div class="settings-group">
                        <label for="theme-select">Theme</label>
                        <select id="theme-select">
                            <option value="dark" selected>Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load the application as ES modules -->
    <script type="module" src="./app.js"></script>
</body>
</html>
