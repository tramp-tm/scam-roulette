<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">Scam Roulette</title>
    <script>
        // Apply the saved theme before first paint to avoid a flash of the wrong theme.
        // When no theme has been chosen yet, follow the OS preference (fallback: light).
        (function () {
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) { /* storage unavailable */ }

            if (!theme) {
                theme = 'light';
                try {
                    if (window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        theme = 'dark';
                    }
                } catch (e) { /* keep light fallback */ }
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Lots List -->
        <div class="left-panel">
            <div class="panel">
                <!-- Header row with title, sort switch and the ext toggle -->
                <div class="lots-header-row">
                    <h3 data-i18n="lots.title">📋 Lots</h3>
                    <div class="lots-header-tools">
                        <!-- "Only active" list filter: a view-only toggle, never disabled -->
                        <button id="active-only-toggle" class="btn-secondary header-tool-btn" data-i18n-title="lots.activeOnlyTitle" title="Show only active lots">
                            <span id="active-only-icon" aria-hidden="true">🔲</span>
                        </button>
                        <div id="sort-controls" class="switch">
                            <button id="sort-by-name" class="switch-btn active" data-sort-field="name" data-i18n-title="sort.titleByName" title="Sort by name (A-Z)">
                                <span class="label-primary" data-i18n="sort.byName">🅰️ Name</span><span class="sort-direction" aria-hidden="true"></span>
                            </button>
                            <button id="sort-by-amount" class="switch-btn" data-sort-field="amount" data-i18n-title="sort.titleByAmount" title="Sort by amount ($ low-high)">
                                <span class="label-primary" data-i18n="sort.byAmount">💵 Amount</span><span class="sort-direction" aria-hidden="true"></span>
                            </button>
                        </div>
                        <button id="ext-toggle" class="btn-secondary header-tool-btn" data-i18n-title="lots.extToggleTitle" title="↔️">↔️</button>
                    </div>
                </div>

                <!-- Scrollable lots list wrapper -->
                <div id="lots-list-wrapper">
                    <ul id="lots-list"></ul>
                </div>

                <!-- Add New Lot Row (outside scrollable area, always visible) -->
                <li class="lot-item add-row">
                    <div id="new-lot-color-indicator" class="lot-color-indicator"></div>
                    <input type="text" id="new-lot-name" data-i18n-placeholder="lots.placeholderName" placeholder="Lot Name" class="add-lot-input">
                    <input type="number" id="new-lot-amount" data-i18n-placeholder="lots.placeholderAmount" placeholder="$" min="0.01" step="0.01" value="1" class="add-lot-amount">
                    <button id="add-lot-btn" class="btn-add">➕</button>
                </li>
            </div>
        </div>

        <!-- Center Panel: Canvas, Result Display, Stats, and Controls -->
        <div class="main-panel">
            <h1 data-i18n="main.title">🎰 Scam Roulette 🎰</h1>


            <!-- Combined container for result-display and stats (equal height) -->
            <div id="info-container">
                <div id="result-display">
                    <div id="result-text" data-i18n-dynamic="mode-name"></div>
                </div>
                <div id="stats-display">
                    <div class="stat-item">
                        <div id="total-lots" class="stat-value">0</div>
                        <div class="stat-label" data-i18n="stats.totalLots">Total Lots</div>
                    </div>
                    <div class="stat-item">
                        <div id="active-lots" class="stat-value">0</div>
                        <div class="stat-label" data-i18n="stats.activeLots">Active Lots</div>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="roulette-canvas" width="600" height="500"></canvas>
            </div>

            <div class="panel controls-panel">
                <h3 data-i18n="controls.title">Controls</h3>
                <div style="display: flex; gap: 15px;">
                    <button id="spin-btn" class="btn-primary" data-i18n="controls.spin">🎲 SPIN!</button>
                    <button id="reset-btn" class="btn-secondary" data-i18n="controls.reset">🔄 Reset</button>
                    <button id="import-btn-controls" class="btn-secondary" data-i18n="controls.import">📥 Import</button>
                    <button id="clear-btn-controls" class="btn-secondary" data-i18n="controls.clear">🗑️ Clear</button>
                </div>
            </div>
        </div>

        <!-- Import dialog will be created dynamically by ImportDialog component -->

        <!-- Right Panel: Settings -->
        <div class="sidebar">
            <!-- Settings Panel -->
            <div class="panel settings-panel">
                <div class="settings-header-row">
                    <h3 data-i18n="settings.title">⚙️ Settings</h3>
                    <button id="toggle-settings-subblock" class="settings-toggle-btn" title="Toggle additional settings">⁝</button>
                </div>

                <!-- Main settings (always visible) -->
                <div class="settings-main-block">
                    <div class="settings-group">
                        <label for="mode-select" data-i18n="settings.gameMode">Game Mode</label>
                        <div class="select-with-help">
                            <select id="mode-select">
                                <option value="normal" selected data-i18n="mode.normal.name">Normal</option>
                                <option value="survival" data-i18n="mode.survival.name">Survival</option>
                                <option value="crown-defense-half-test" data-i18n="mode.crown-defense-half-test.name">Crown Defense: Half Damage</option>
                                <option value="weakest-link" data-i18n="mode.weakest-link.name">The Weakest Link</option>
                                <option value="king-of-the-hill-amount" data-i18n="mode.king-of-the-hill-amount.name">King of the Hill: HP = Amount</option>
                            </select>
                            <span id="mode-help" class="settings-help" aria-hidden="true">?</span>
                        </div>
                    </div>

                <div class="settings-group">
                    <label for="visualization-select" data-i18n="settings.visualization">Visualization</label>
                    <select id="visualization-select">
                        <option value="wheel" selected data-i18n="settings.vizWheel">Wheel</option>
                        <option value="strip" data-i18n="settings.vizStrip">Strip</option>
                        <option value="counting-rhyme" data-i18n="settings.vizCountingRhyme">Counting Rhyme</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="duration-slider" data-i18n="settings.animationDuration">Animation Duration</label>
                    <div class="slider-container">
                        <input type="range" id="duration-slider" min="1" max="68" step="1" value="30">
                        <div class="duration-value-wrapper">
                            <input type="number" id="duration-input" min="1" max="300" step="1" value="3" class="duration-number-input">
                            <span id="duration-value-unit" data-i18n="duration.unit"></span>
                        </div>
                    </div>
                </div>
                </div><!-- /settings-main-block: it used to be left open, which nested everything after it -->

                <!-- Collapsible sub-block (hidden by default) -->
                <div id="settings-subblock" class="settings-sub-block hidden">
                    <h4 data-i18n="settings.additionalOptions">Additional Options</h4>

                    <div class="settings-group">
                        <label for="language-select">Language 语</label>
                        <select id="language-select">
                            <option value="en" selected>English</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>

                    <div class="settings-group">
                        <label for="theme-select" data-i18n="settings.theme">Theme</label>
                        <select id="theme-select">
                            <option value="dark" data-i18n="settings.themeDark">Dark</option>
                            <option value="light" data-i18n="settings.themeLight">Light</option>
                            <option value="emerald" data-i18n="settings.themeEmerald">Emerald</option>
                            <option value="eucalyptus" data-i18n="settings.themeEucalyptus">Eucalyptus</option>
                            <option value="nordic" data-i18n="settings.themeNordic">Nordic</option>
                            <option value="monochrome" data-i18n="settings.themeMonochrome">Monochrome Tech</option>
                            <option value="nebula" data-i18n="settings.themeNebula">Monochrome Tech</option>
                        </select>
                    </div>

                    <div class="settings-group">
                        <label for="easing-select" data-i18n="settings.easingFunction">Easing Function</label>
                        <div class="select-with-help">
                            <select id="easing-select">
                                <option value="rouletteEaseOut" selected data-i18n="easing.rouletteEaseOut.name">Roulette Ease Out</option>
                                <option value="easeOutCubic" data-i18n="easing.easeOutCubic.name">Cubic Ease Out</option>
                                <option value="easeOutQuart" data-i18n="easing.easeOutQuart.name">Quartic Ease Out</option>
                                <option value="easeOutQuint" data-i18n="easing.easeOutQuint.name">Quintic Ease Out</option>
                                <option value="easeOutExpo" data-i18n="easing.easeOutExpo.name">Exponential Ease Out</option>
                                <option value="linear" data-i18n="easing.linear.name">Linear (No Easing)</option>
                            </select>
                            <span id="easing-help" class="settings-help" aria-hidden="true">?</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Visualization Tuning Panel -->
            <div class="panel">
                <div class="settings-header-row">
                    <h3 data-i18n="settings.vizTuningTitle">🎛 Visualization settings</h3>
                    <button id="toggle-viz-subblock" class="settings-toggle-btn" title="Toggle visualization settings">⁝</button>
                </div>

                <!-- Collapsible sub-block (hidden by default) -->
                <div id="viz-subblock" class="settings-sub-block hidden">
                    <div class="settings-group">
                        <label data-i18n="settings.realChances">Real chances</label>
                        <div id="real-chances-switch" class="switch">
                            <button class="switch-btn active" data-value="off" data-i18n="settings.off">Off</button>
                            <button class="switch-btn" data-value="on" data-i18n="settings.on">On</button>
                        </div>
                    </div>

                    <div class="settings-group">
                        <label data-i18n="settings.realMagnitudes">Real magnitudes</label>
                        <div id="real-magnitudes-switch" class="switch">
                            <button class="switch-btn active" data-value="off" data-i18n="settings.off">Off</button>
                            <button class="switch-btn" data-value="on" data-i18n="settings.on">On</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="papaparse.min.js"></script>
    <!-- Load the application as ES modules -->
    <script type="module" src="./app.js"></script>
</body>
</html>
