<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weighted Roulette</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Lots Management -->
        <aside class="panel left-panel">
            <h2>Lots</h2>
            
            <form id="lot-form" class="lot-form">
                <div class="form-group">
                    <label for="lot-name">Name:</label>
                    <input type="text" id="lot-name" required maxlength="30">
                </div>
                <div class="form-group">
                    <label for="lot-amount">Amount (Weight):</label>
                    <input type="number" id="lot-amount" min="0.01" step="0.01" value="1" required>
                </div>
                <div class="form-group">
                    <label for="lot-color">Color:</label>
                    <input type="color" id="lot-color" value="#3498db">
                </div>
                <button type="submit" class="btn btn-add">Add Lot</button>
            </form>

            <ul id="lots-list" class="lots-list"></ul>
            
            <div class="panel-footer">
                <span>Total: <strong id="total-lots">0</strong></span>
                <span>Active: <strong id="active-lots">0</strong></span>
            </div>
        </aside>

        <!-- Center Panel: Roulette Visualization -->
        <main class="center-panel">
            <canvas id="roulette-canvas" width="600" height="500"></canvas>
            
            <div class="controls">
                <button id="spin-btn" class="btn btn-spin">SPIN</button>
            </div>

            <div id="result-display" class="result-display hidden">
                <span id="result-text"></span>
            </div>
        </main>

        <!-- Right Panel: Settings -->
        <aside class="panel right-panel">
            <h2>Settings</h2>
            
            <div class="settings-group">
                <label>Mode:</label>
                <select id="mode-select">
                    <option value="normal">Normal</option>
                    <option value="survival">Survival</option>
                </select>
            </div>

            <div class="settings-group">
                <label>Visualization:</label>
                <select id="visualization-select">
                    <option value="wheel">Wheel</option>
                    <option value="strip">Horizontal Strip</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="duration-slider">Animation Duration:</label>
                <input type="range" id="duration-slider" min="1000" max="10000" step="500" value="3000">
                <span id="duration-value">3.0s</span>
            </div>

            <div class="settings-group">
                <label for="spins-slider">Number of Spins:</label>
                <input type="range" id="spins-slider" min="1" max="20" step="1" value="5">
                <span id="spins-value">5</span>
            </div>

            <button id="reset-btn" class="btn btn-reset">Reset All</button>
        </aside>
    </div>

    <script type="module" src="app.ts"></script>
</body>
</html>
