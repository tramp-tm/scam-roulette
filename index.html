<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .main-panel {
            flex: 1;
            min-width: 500px;
        }

        .sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .canvas-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #roulette-canvas {
            width: 100%;
            height: 500px;
            display: block;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .panel h3 {
            margin-bottom: 15px;
            color: #f39c12;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-item {
            padding: 15px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #f39c12;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.7;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
        }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: white;
            font-weight: bold;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #lots-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .lot-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .lot-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .lot-item.inactive {
            opacity: 0.5;
        }

        .lot-item.highlighted {
            border: 2px solid #f39c12;
            background: rgba(243, 156, 18, 0.2);
        }

        .lot-color-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .lot-info {
            flex: 1;
        }

        .lot-name {
            font-weight: bold;
        }

        .lot-amount {
            font-size: 0.85em;
            opacity: 0.7;
        }

        .lot-actions {
            display: flex;
            gap: 5px;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .settings-group {
            margin-bottom: 15px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 6px;
            padding: 0;
        }

        .slider-value {
            min-width: 50px;
            text-align: right;
            font-weight: bold;
            color: #f39c12;
        }

        #result-display {
            background: rgba(243, 156, 18, 0.2);
            border: 2px solid #f39c12;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        #result-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #f39c12;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: auto;
            }

            .main-panel {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Add Lot, Lots List -->
        <div class="left-panel">
            <!-- Add Lot Form -->
            <div class="panel">
                <h3>➕ Add New Lot</h3>
                <form id="lot-form">
                    <input type="text" id="lot-name" placeholder="Lot Name" required minlength="1" maxlength="50">
                    <input type="number" id="lot-amount" placeholder="Amount ($)" required min="0.01" step="0.01" value="1">
                    <input type="color" id="lot-color" value="#3498db">
                    <button type="submit" class="btn-primary">Add Lot</button>
                </form>
            </div>

            <!-- Lots List -->
            <div class="panel">
                <h3>📋 Lots</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div id="total-lots" class="stat-value">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-item">
                        <div id="active-lots" class="stat-value">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>
                <ul id="lots-list"></ul>
            </div>
        </div>

        <!-- Center Panel: Canvas and Controls -->
        <div class="main-panel">
            <h1>🎰 Roulette Game 🎰</h1>
            
            <div id="result-display" class="hidden">
                <div id="result-text"></div>
            </div>

            <div class="canvas-container">
                <canvas id="roulette-canvas"></canvas>
            </div>

            <div class="panel">
                <h3>Controls</h3>
                <div style="display: flex; gap: 15px;">
                    <button id="spin-btn" class="btn-primary">🎲 SPIN!</button>
                    <button id="reset-btn" class="btn-secondary">🔄 Reset</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Settings -->
        <div class="sidebar">
            <!-- Settings Panel -->
            <div class="panel">
                <h3>⚙️ Settings</h3>
                
                <div class="settings-group">
                    <label for="mode-select">Game Mode</label>
                    <select id="mode-select">
                        <option value="normal">Normal (Higher amount = Higher chance)</option>
                        <option value="survival">Survival (Lower amount = Higher chance to be eliminated)</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="visualization-select">Visualization</label>
                    <select id="visualization-select">
                        <option value="wheel">Wheel</option>
                        <option value="strip">Strip</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="duration-slider">Animation Duration</label>
                    <div class="slider-container">
                        <input type="range" id="duration-slider" min="1000" max="10000" step="500" value="3000">
                        <span id="duration-value" class="slider-value">3.0s</span>
                    </div>
                </div>

                <div class="settings-group">
                    <label for="spins-slider">Number of Spins</label>
                    <div class="slider-container">
                        <input type="range" id="spins-slider" min="1" max="20" step="1" value="5">
                        <span id="spins-value" class="slider-value">5</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load the application as ES modules -->
    <script type="module" src="./app.js"></script>
</body>
</html>
