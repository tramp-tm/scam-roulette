<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Game</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Lots List -->
        <div class="left-panel">
            <div class="panel">
                <h3>📋 Lots</h3>
                <ul id="lots-list"></ul>
                
                <!-- Add New Lot Row (inline at bottom of table) -->
                <li class="lot-item add-row">
                    <div id="new-lot-color-indicator" class="lot-color-indicator"></div>
                    <input type="text" id="new-lot-name" placeholder="Lot Name" class="add-lot-input">
                    <input type="number" id="new-lot-amount" placeholder="$" min="0.01" step="0.01" value="1" class="add-lot-amount">
                    <button id="add-lot-btn" class="btn-add">➕</button>
                </li>
            </div>
        </div>

        <!-- Center Panel: Canvas, Result Display, Stats, and Controls -->
        <div class="main-panel">
            <h1>🎰 Roulette Game 🎰</h1>
            
            <!-- Combined container for result-display and stats (equal height) -->
            <div id="info-container">
                <div id="result-display">
                    <div id="result-text"></div>
                </div>
                <div id="stats-display">
                    <div class="stat-item">
                        <div id="total-lots" class="stat-value">0</div>
                        <div class="stat-label">Total Lots</div>
                    </div>
                    <div class="stat-item">
                        <div id="active-lots" class="stat-value">0</div>
                        <div class="stat-label">Active Lots</div>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="roulette-canvas" width="600" height="500"></canvas>
            </div>

            <div class="panel">
                <h3>Controls</h3>
                <div style="display: flex; gap: 15px;">
                    <button id="spin-btn" class="btn-primary">🎲 SPIN!</button>
                    <button id="reset-btn" class="btn-secondary">🔄 Reset</button>
                    <button id="import-btn-controls" class="btn-secondary">📥 Import</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Settings -->
        <div class="sidebar">
            <!-- Settings Panel -->
            <div class="panel">
                <h3>⚙️ Settings</h3>
                
                <div class="settings-group">
                    <label for="mode-select">Game Mode</label>
                    <select id="mode-select">
                        <option value="normal" selected>Normal (Higher amount = Higher chance)</option>
                        <option value="survival">Survival (Lower amount = Eliminated first)</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="visualization-select">Visualization</label>
                    <select id="visualization-select">
                        <option value="wheel" selected>Wheel</option>
                        <option value="strip">Strip</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label for="duration-slider">Animation Duration</label>
                    <div class="slider-container">
                        <input type="range" id="duration-slider" min="1000" max="10000" step="500" value="3000">
                        <span id="duration-value" class="slider-value">3.0s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Dialog Modal -->
    <div id="import-dialog" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            
            <h2>Import Lots</h2>
            
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="csv">CSV Import</button>
                <button class="tab-button" data-tab="link">Link Import</button>
            </div>
            
            <!-- CSV Tab Content -->
            <div id="tab-csv" class="tab-content active">
                <p class="tab-instruction">Paste your lots below (name, amount per line):</p>
                
                <textarea 
                    id="import-textarea" 
                    placeholder="Alice, 100&#10;Bob, 250&#10;Charlie, 75"
                    rows="6"></textarea>
                
                <div class="settings-group">
                    <label for="separator-select">Separator:</label>
                    <select id="separator-select">
                        <option value="comma" selected>Comma (,)</option>
                        <option value="tab">Tab (&#9;)</option>
                    </select>
                </div>
                
                <div class="import-actions">
                    <button id="preview-btn" class="btn-secondary">👁️ Preview</button>
                    <button id="import-btn" class="btn-primary">📥 Import</button>
                </div>
                
                <!-- Status Line -->
                <div id="import-status" class="import-status hidden">
                    <span id="valid-count"></span> valid lots, 
                    <span id="error-count"></span> errors
                </div>
                
                <!-- Preview Container -->
                <div id="preview-container" class="preview-container hidden">
                    <h4>Preview:</h4>
                    <ul id="preview-lots-list"></ul>
                </div>
            </div>
            
            <!-- Link Tab Content (Placeholder) -->
            <div id="tab-link" class="tab-content">
                <p class="placeholder-text">Link import coming soon...</p>
            </div>
        </div>
    </div>

    <!-- Load the application as ES modules -->
    <script type="module" src="./app.js"></script>
</body>
</html>
